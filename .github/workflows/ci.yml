name: CPU validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      YOLO_AUTOINSTALL: "false"
      YOLO_OFFLINE: "true"
      YOLO_CONFIG_DIR: /tmp/axell-yolo-settings
      OMP_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/axell-matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the CPU validation environment
        run: |
          python -m pip install --require-hashes -r requirements-cpu.lock
          python -m pip install --no-deps -e '.[runtime]'
          python -m pip install ruff==0.11.13
          python -m pip check
      - name: Check source and publication contents
        run: |
          ruff check src tests scripts
          python scripts/check_public_files.py
      - name: Test export, augmentation workers and synthetic training
        run: python -m unittest discover -s tests -v
