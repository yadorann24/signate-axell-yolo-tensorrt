[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axell-yolo-tensorrt"
version = "0.1.0"
description = "YOLO negative-object augmentation and TensorRT export for the Axell detection task"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
runtime = [
  "ultralytics==8.3.170",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
]
export = [
  "ultralytics==8.3.170",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "onnx==1.16.2",
  "onnxslim==0.1.59",
  "onnxruntime-gpu==1.22.0",
  "tensorrt-cu12==10.13.0.35",
]

[project.scripts]
axell-export = "axell_export.cli:main"
axell-benchmark = "axell_export.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
